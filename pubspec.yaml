name: daira
description: Daira mobile application, backed exclusively by Odoo 19.
publish_to: none
version: 1.1.0+3
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  intl: ^0.20.2
  shared_preferences: 2.5.3
  flutter_secure_storage: 9.2.4
  app_links: 7.2.2
  share_plus: 10.1.4
  go_router: ^16.0.0
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  flutter_launcher_icons: ^0.14.1
flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: Phosphor
      fonts:
        - asset: assets/fonts/phosphor/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  remove_alpha_ios: true
  image_path: 'assets/icons/play-icon-512.png'
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: 'assets/icons/play-icon-512.png'
  min_sdk_android: 21